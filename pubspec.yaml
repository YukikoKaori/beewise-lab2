name: beewise
description: "BeeWise - cloud-enabled tutoring app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cloud_firestore: 7.1.0
  firebase_ai: 5.1.0
  firebase_analytics: 13.0.1
  firebase_app_check: 0.5.1
  firebase_auth: 7.0.1
  firebase_core: 5.1.0
  firebase_crashlytics: 6.0.1
  firebase_messaging: 17.0.1
  firebase_remote_config: 7.0.1
  firebase_storage: 14.0.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  google_sign_in: 7.2.0
  intl: 0.20.3
  path_provider: 2.1.6
  pdf: 3.13.1
  share_plus: 13.3.1
  shared_preferences: 2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.4
  firebase_messaging_platform_interface: 4.11.1
  path_provider_platform_interface: 2.1.3
  shared_preferences_platform_interface: 2.4.2

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
