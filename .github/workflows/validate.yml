name: BeeWise validation
on:
  pull_request:
  push:
    branches: [main, 'codex/lab3-postmerge-corrective*']
permissions:
  contents: read
jobs:
  flutter-android:
    defaults:
      run:
        working-directory: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  flutter-web-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - working-directory: packages/core
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --reporter expanded
      - working-directory: web
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test --reporter expanded
          flutter build web --release

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci --prefix firebase --ignore-scripts
      - run: npm --prefix firebase test
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm audit --prefix backend --omit=dev
      - run: npm --prefix backend test
  e2e-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project e2e_test --frozen
      - run: uv run --project e2e_test pytest -c e2e_test/pyproject.toml e2e_test --collect-only -q
      - run: python scripts/check_e2e_harness.py
      - run: python scripts/test_measure_bao_startup.py
